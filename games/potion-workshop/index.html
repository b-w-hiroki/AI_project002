<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ポーション工房 | Potion Workshop</title>
    <meta name="description" content="クリックして調合、設備を集めて自動生産、転生して強くなる放置ゲーム。ブラウザですぐ遊べます。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://b-w-hiroki.github.io/AI_project002/potion-workshop/" />
    <meta property="og:title" content="ポーション工房 | Potion Workshop" />
    <meta property="og:description" content="クリックして調合、設備を集めて自動生産、転生して強くなる放置ゲーム。ブラウザですぐ遊べます。" />
    <meta property="og:image" content="https://b-w-hiroki.github.io/AI_project002/potion-workshop/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ポーション工房 | Potion Workshop" />
    <meta name="twitter:description" content="クリックして調合、設備を集めて自動生産、転生して強くなる放置ゲーム。ブラウザですぐ遊べます。" />
    <meta name="twitter:image" content="https://b-w-hiroki.github.io/AI_project002/potion-workshop/og-image.png" />
    <style>
      :root { --accent:78,204,163; --shell:#0b1119; --shell2:#142335; --chrome:#eefcff; }
      * { box-sizing:border-box; }
      html, body { margin:0; height:100%; touch-action:none; overscroll-behavior:none; }
      body { display:grid; place-items:center; overflow:hidden; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background:radial-gradient(circle at 50% 42%,rgba(var(--accent),.17),transparent 36%),linear-gradient(150deg,var(--shell2),var(--shell) 58%,#06090e); color:var(--chrome); }
      body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.12; background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px); background-size:32px 32px; mask-image:radial-gradient(circle at center,#000 20%,transparent 78%); }
      #game { position:relative; line-height:0; filter:drop-shadow(0 18px 40px rgba(0,0,0,.38)); }
      #game canvas { display:block; max-width:calc(100vw - 18px); max-height:calc(100vh - 82px); touch-action:none; border-radius:14px; }
      #game::before { content:""; position:absolute; z-index:20; pointer-events:none; inset:-6px; border-radius:20px; border:1px solid rgba(var(--accent),.82); box-shadow:0 0 0 2px rgba(255,255,255,.05),0 0 34px rgba(var(--accent),.2),inset 0 0 22px rgba(var(--accent),.07); }
      #game::after { content:""; position:absolute; z-index:19; pointer-events:none; inset:0; border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 13%,transparent 83%,rgba(0,0,0,.1)); box-shadow:inset 0 0 26px rgba(0,0,0,.1); }
      .game-rail { position:fixed; z-index:9998; left:50%; transform:translateX(-50%); pointer-events:none; display:flex; align-items:center; gap:9px; min-height:30px; max-width:calc(100vw - 180px); padding:0 13px; border:1px solid rgba(var(--accent),.42); border-radius:999px; background:rgba(8,13,20,.74); backdrop-filter:blur(12px); box-shadow:0 8px 26px rgba(0,0,0,.24); color:#eefcff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font:800 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif; letter-spacing:.05em; }
      .game-rail--top { top:calc(8px + env(safe-area-inset-top)); }
      .game-rail--bottom { bottom:calc(8px + env(safe-area-inset-bottom)); color:#c4d7de; }
      .rail-kicker { color:rgb(var(--accent)); font-size:10px; letter-spacing:.14em; }
      .rail-title { color:#fff; font-size:12px; }
      .status-dot { width:7px; height:7px; flex:0 0 auto; border-radius:50%; background:rgb(var(--accent)); box-shadow:0 0 12px rgba(var(--accent),.9); animation:pulse 1.2s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity:.45; transform:scale(.78); } to { opacity:1; transform:scale(1.08); } }
      .hub-return { position:fixed; z-index:9999; top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left)); min-height:34px; display:flex; align-items:center; padding:0 11px; border:1px solid rgba(255,255,255,.18); border-radius:999px; background:rgba(8,13,20,.74); backdrop-filter:blur(12px); color:#fff; text-decoration:none; font:800 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.04em; touch-action:manipulation; }
      @media (max-width:680px) { .game-rail--top { left:auto; right:8px; transform:none; max-width:calc(100vw - 125px); } .game-rail--bottom { max-width:calc(100vw - 20px); } #game canvas { max-width:calc(100vw - 10px); } }
      @media (max-height:520px) { .game-rail--bottom { display:none; } #game canvas { max-height:calc(100vh - 48px); } }
    </style>
  </head>
  <body>
    <a class="hub-return" href="../" aria-label="ゲーム一覧へ戻る">← GAME LAB</a>
    <div class="game-rail game-rail--top" aria-hidden="true"><span class="status-dot"></span><span class="rail-kicker">BREW</span><span class="rail-title">ポーション工房</span></div>
    <div id="game"></div>
    <div class="game-rail game-rail--bottom" aria-hidden="true"><span class="rail-kicker">MISSION</span><span>調合 → 設備 → 街の需要を回し、工房を育てろ</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
