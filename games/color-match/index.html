<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="文字の色・意味とカードの色を素早く見分ける、認知力と反応速度を試すカードゲーム。ブラウザですぐ遊べます。" />

    <meta property="og:url" content="https://b-w-hiroki.github.io/AI_project002/color-match/" />
    <meta property="og:title" content="カラーマッチ | Color Match" />
    <meta property="og:description" content="文字の色・意味とカードの色を素早く見分ける、認知力と反応速度を試すカードゲーム。ブラウザですぐ遊べます。" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="カラーマッチ | Color Match" />
    <meta name="twitter:description" content="文字の色・意味とカードの色を素早く見分ける、認知力と反応速度を試すカードゲーム。ブラウザですぐ遊べます。" />
    <meta name="twitter:image" content="https://b-w-hiroki.github.io/AI_project002/color-match/og-image.png" />
    <style>
      :root { --accent:255,122,61; --shell:#12131b; --shell2:#23212d; --chrome:#fff7e9; }
      * { box-sizing:border-box; }
      html, body { margin:0; height:100%; touch-action:none; overscroll-behavior:none; }
      body { display:grid; place-items:center; overflow:hidden; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background:radial-gradient(circle at 50% 42%,rgba(var(--accent),.16),transparent 36%),linear-gradient(150deg,var(--shell2),var(--shell) 58%,#0a0b10); color:var(--chrome); }
      body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.12; background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px); background-size:30px 30px; mask-image:radial-gradient(circle at center,#000 20%,transparent 78%); }
      #game { position:relative; line-height:0; filter:drop-shadow(0 18px 40px rgba(0,0,0,.36)); }
      #game canvas { display:block; max-width:calc(100vw - 18px); max-height:calc(100vh - 82px); touch-action:none; border-radius:14px; }
      #game::before { content:""; position:absolute; z-index:20; pointer-events:none; inset:-6px; border-radius:20px; border:1px solid rgba(var(--accent),.82); box-shadow:0 0 0 2px rgba(255,255,255,.05),0 0 34px rgba(var(--accent),.18),inset 0 0 22px rgba(var(--accent),.07); }
      #game::after { content:""; position:absolute; z-index:19; pointer-events:none; inset:0; border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 13%,transparent 83%,rgba(0,0,0,.08)); box-shadow:inset 0 0 24px rgba(0,0,0,.08); }
      .game-rail { position:fixed; z-index:9998; left:50%; transform:translateX(-50%); pointer-events:none; display:flex; align-items:center; gap:9px; min-height:30px; max-width:calc(100vw - 180px); padding:0 13px; border:1px solid rgba(var(--accent),.42); border-radius:999px; background:rgba(12,13,20,.74); backdrop-filter:blur(12px); box-shadow:0 8px 26px rgba(0,0,0,.24); color:#fff4e5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font:800 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif; letter-spacing:.05em; }
      .game-rail--top { top:calc(8px + env(safe-area-inset-top)); }
      .game-rail--bottom { bottom:calc(8px + env(safe-area-inset-bottom)); color:#d8d6df; }
      .rail-kicker { color:rgb(var(--accent)); font-size:10px; letter-spacing:.14em; }
      .rail-title { color:#fff; font-size:12px; }
      .status-dot { width:7px; height:7px; flex:0 0 auto; border-radius:50%; background:rgb(var(--accent)); box-shadow:0 0 12px rgba(var(--accent),.9); animation:pulse 1.05s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity:.45; transform:scale(.78); } to { opacity:1; transform:scale(1.08); } }
      .hub-return { position:fixed; z-index:9999; top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left)); min-height:34px; display:flex; align-items:center; padding:0 11px; border:1px solid rgba(255,255,255,.18); border-radius:999px; background:rgba(12,13,20,.74); backdrop-filter:blur(12px); color:#fff; text-decoration:none; font:800 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.04em; touch-action:manipulation; }
      @media (max-width:680px) { .game-rail--top { left:auto; right:8px; transform:none; max-width:calc(100vw - 125px); } .game-rail--bottom { max-width:calc(100vw - 20px); } #game canvas { max-width:calc(100vw - 10px); } }
      @media (max-height:520px) { .game-rail--bottom { display:none; } #game canvas { max-height:calc(100vh - 48px); } }
    </style>
  </head>
  <body>
    <a class="hub-return" href="../" aria-label="ゲーム一覧へ戻る">← GAME LAB</a>
    <div class="game-rail game-rail--top" aria-hidden="true"><span class="status-dot"></span><span class="rail-kicker">FLOW</span><span class="rail-title">カラーマッチ</span></div>
    <div id="game"></div>
    <div class="game-rail game-rail--bottom" aria-hidden="true"><span class="rail-kicker">MISSION</span><span>指示を読み、速く正確に合わせ続けろ</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
