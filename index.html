<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI_project002 — GAME LAB</title>
    <meta name="description" content="AIと一緒に、遊びの芯から作るブラウザゲーム実験室。" />
    <style>
      :root { color-scheme: dark; --bg:#080910; --panel:#11131d; --text:#f4f5fb; --muted:#8f94aa; }
      * { box-sizing: border-box; }
      html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif; }
      body {
        padding: 28px 20px 72px;
        background:
          radial-gradient(circle at 15% -10%, rgba(91,91,255,.18), transparent 34%),
          radial-gradient(circle at 100% 8%, rgba(255,85,155,.12), transparent 28%),
          linear-gradient(180deg,#0b0c14 0%,#080910 52%,#07080c 100%);
      }
      .shell { width:min(1180px,100%); margin:0 auto; }
      .topbar { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:72px; }
      .brand { font-size:.78rem; letter-spacing:.18em; font-weight:800; color:#d8daf0; text-transform:uppercase; }
      .repo { color:#969bb5; text-decoration:none; font-size:.82rem; border:1px solid #2a2d3c; border-radius:999px; padding:8px 12px; background:rgba(255,255,255,.025); }
      .repo:hover { color:#fff; border-color:#4a4f66; }
      .hero { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(280px,.55fr); gap:40px; align-items:end; margin-bottom:46px; }
      .eyebrow { margin:0 0 14px; color:#9fa4bd; font-size:.78rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
      h1 { margin:0; max-width:820px; font-size:clamp(2.5rem,7vw,5.9rem); line-height:.94; letter-spacing:-.055em; }
      .lead { margin:0; color:#a7abc0; font-size:clamp(.95rem,2vw,1.08rem); line-height:1.85; max-width:420px; }
      .section-head { display:flex; justify-content:space-between; align-items:end; gap:18px; margin:0 0 18px; }
      .section-head h2 { margin:0; font-size:1rem; letter-spacing:.08em; text-transform:uppercase; }
      .section-head span { color:#6f748c; font-size:.78rem; }
      .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:18px; }
      .card {
        --accent:#6ee7b7;
        grid-column:span 4;
        min-height:360px;
        display:flex;
        flex-direction:column;
        position:relative;
        overflow:hidden;
        border:1px solid #222634;
        border-radius:24px;
        background:linear-gradient(180deg,#141722 0%,#0f1119 100%);
        color:inherit;
        text-decoration:none;
        transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
      }
      .card.featured { grid-column:span 4; min-height:430px; }
      .card:hover { transform:translateY(-6px); border-color:color-mix(in srgb,var(--accent) 60%,#3a3d4b); box-shadow:0 28px 55px -32px color-mix(in srgb,var(--accent) 55%,transparent); }
      .thumb { position:relative; height:210px; overflow:hidden; background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,#161925),#0b0c12 72%); }
      .featured .thumb { height:250px; }
      .thumb::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 38%,rgba(7,8,12,.18) 68%,rgba(7,8,12,.72) 100%); }
      .art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .35s ease,filter .35s ease; }
      .card:hover .art { transform:scale(1.045); filter:saturate(1.08) contrast(1.03); }
      .fallback { position:absolute; inset:0; display:grid; place-items:center; font-size:4rem; }
      .thumb:has(.art) .fallback { display:none; }
      .meta { position:absolute; left:16px; right:16px; top:14px; z-index:2; display:flex; justify-content:space-between; align-items:center; gap:8px; }
      .rank { font-size:.66rem; letter-spacing:.12em; font-weight:900; text-transform:uppercase; padding:6px 9px; border-radius:999px; color:#fff; background:rgba(8,9,16,.62); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(8px); }
      .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 18px var(--accent); }
      .body { flex:1; display:flex; flex-direction:column; gap:12px; padding:20px 20px 18px; }
      .tags { display:flex; flex-wrap:wrap; gap:7px; }
      .tag { font-size:.66rem; font-weight:800; letter-spacing:.04em; color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 28%,transparent); background:color-mix(in srgb,var(--accent) 9%,transparent); border-radius:999px; padding:4px 8px; }
      .card h3 { margin:0; font-size:1.32rem; letter-spacing:-.02em; }
      .desc { margin:0; color:#9ca1b8; line-height:1.65; font-size:.86rem; }
      .moment { margin-top:auto; padding-top:4px; color:#cfd2df; font-size:.78rem; line-height:1.5; }
      .cta { display:flex; justify-content:space-between; align-items:center; margin-top:2px; padding-top:14px; border-top:1px solid #242735; color:#f5f6fb; font-size:.78rem; font-weight:900; letter-spacing:.08em; }
      .cta b { color:var(--accent); font-size:1rem; }
      footer { margin-top:50px; color:#62677c; font-size:.76rem; line-height:1.7; }
      @media (max-width:900px) {
        .hero { grid-template-columns:1fr; gap:20px; margin-bottom:38px; }
        .lead { max-width:660px; }
        .card,.card.featured { grid-column:span 6; }
      }
      @media (max-width:620px) {
        body { padding:20px 14px 48px; }
        .topbar { margin-bottom:48px; }
        .repo { font-size:.72rem; }
        .grid { gap:14px; }
        .card,.card.featured { grid-column:1/-1; min-height:0; border-radius:20px; }
        .thumb,.featured .thumb { height:205px; }
        .hero { margin-bottom:34px; }
        h1 { font-size:clamp(2.65rem,16vw,4.2rem); }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="topbar">
        <div class="brand">AI_project002 / Game Lab</div>
        <a class="repo" href="https://github.com/b-w-hiroki/AI_project002" target="_blank" rel="noreferrer">GitHub ↗</a>
      </div>

      <section class="hero">
        <div>
          <p class="eyebrow">Playable experiments, not mockups.</p>
          <h1>遊びの芯から、<br />ちゃんとゲームにする。</h1>
        </div>
        <p class="lead">AIを開発パートナーに、ジャンルの違う6作品を実装。判断、手触り、成長、見せ場まで含めて「また触りたくなる瞬間」を試しています。</p>
      </section>

      <div class="section-head">
        <h2>Playable Works</h2>
        <span>6 games / browser playable</span>
      </div>
      <section class="grid" id="grid" aria-label="ゲーム一覧"></section>

      <footer>AI_project002 — AIを活用しながら、企画・実装・検証・ビジュアル改善まで一続きで試すゲーム開発プロジェクト。</footer>
    </main>

    <script>
      const PROJECTS = [
        { emoji:"🧪", title:"ポーション工房", tags:["放置・育成","CRAFT"], desc:"調合、設備投資、街の需要、転生。触るほど工房が育っていく放置ゲーム。", moment:"見せ場：錬金術師をタップ → 調合 → 設備が育つ", url:"./potion-workshop/", image:"./potion-workshop/og-image.png", accent:"#58d7a6", featured:true },
        { emoji:"⚔️", title:"剣戟の森", tags:["アクション","BOSS"], desc:"流派を選び、予兆を見てかわし、隙に斬り込む横スクロールアクション。", moment:"見せ場：ボス突進を回避 → 隙に反撃", url:"./side-scroller/", image:"./side-scroller/og-image.png", accent:"#ff668e", featured:true },
        { emoji:"🐎", title:"三国ポチポチ", tags:["タップRPG","EXPEDITION"], desc:"武将を編成し、進軍し、欲張るか帰るかを選ぶ遠征型タップRPG。", moment:"見せ場：大型ボス登場 → 対峙 → 斬撃 → 報酬", url:"./sangoku-tap/", image:"./sangoku-tap/og-image.png", accent:"#ff8b57", featured:true },
        { emoji:"👊", title:"覇拳伝", tags:["格闘","READ"], desc:"敵の予兆を読み、拳・蹴・気の相性を見切って奥義につなぐ格闘バトル。", moment:"見せ場：予兆を読む → 読み勝つ → 奥義", url:"./fist-legend/", image:"./fist-legend/og-image.png", accent:"#f0594d" },
        { emoji:"🗡️", title:"カルマクエスト", tags:["育成RPG","LEGEND"], desc:"勇者の行動を神に報告し、その積み重ねが年代記と次の年を変えていく育成RPG。", moment:"見せ場：実際の出来事が“伝説”として記録される", url:"./karma-quest/", image:"./karma-quest/og-image.png", accent:"#d8b75b" },
        { emoji:"🎴", title:"カラーマッチ", tags:["脳トレ","60 SEC"], desc:"意味を見るか、色を見るか。ルール切替に適応して60秒間の精度と反応速度を競う。", moment:"見せ場：終盤の高速切替で混乱が習熟に変わる", url:"./color-match/", image:"./color-match/og-image.png", accent:"#e8c64f" },
      ];

      const grid = document.getElementById("grid");
      PROJECTS.forEach((project, index) => {
        const card = document.createElement("a");
        card.className = `card${project.featured ? " featured" : ""}`;
        card.href = project.url;
        card.style.setProperty("--accent", project.accent);
        card.innerHTML = `
          <div class="thumb">
            <img class="art" src="${project.image}" alt="" loading="lazy" onerror="this.remove()" />
            <span class="fallback">${project.emoji}</span>
            <div class="meta"><span class="rank">${project.featured ? "Featured" : `No. ${String(index + 1).padStart(2,"0")}`}</span><span class="dot"></span></div>
          </div>
          <div class="body">
            <div class="tags">${project.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
            <h3>${project.title}</h3>
            <p class="desc">${project.desc}</p>
            <p class="moment">${project.moment}</p>
            <div class="cta"><span>PLAY NOW</span><b>→</b></div>
          </div>`;
        grid.appendChild(card);
      });
    </script>
  </body>
</html>
