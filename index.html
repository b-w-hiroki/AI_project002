<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI_project002 — ゲーム一覧</title>
    <meta name="description" content="AIフル活用で開発したブラウザゲーム集。" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d0d14;
        color: #e0e0ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Yu Gothic", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 20px 80px;
      }
      h1 {
        font-size: 1.8rem;
        margin: 0 0 8px;
      }
      p.lead {
        color: #8888aa;
        margin: 0 0 40px;
        text-align: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 24px;
        width: 100%;
        max-width: 720px;
      }
      a.card {
        display: block;
        background: #1e1e38;
        border: 1px solid #33335a;
        border-radius: 16px;
        padding: 28px 24px;
        text-decoration: none;
        color: inherit;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      a.card:hover {
        transform: translateY(-4px);
        border-color: #4ecca3;
      }
      .emoji {
        font-size: 2.4rem;
        display: block;
        margin-bottom: 12px;
      }
      .card h2 {
        font-size: 1.2rem;
        margin: 0 0 6px;
      }
      .card p {
        margin: 0;
        color: #aaaacc;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      footer {
        margin-top: 56px;
        color: #55557a;
        font-size: 0.8rem;
      }
      footer a {
        color: #8888aa;
      }
    </style>
  </head>
  <body>
    <h1>🎮 AI_project002</h1>
    <p class="lead">AIフル活用で開発したブラウザゲーム集</p>
    <div class="grid">
      <a class="card" href="./potion-workshop/">
        <span class="emoji">🧪</span>
        <h2>ポーション工房</h2>
        <p>クリックして調合、設備を集めて自動生産、転生して強くなる放置ゲーム。</p>
      </a>
      <a class="card" href="./side-scroller/">
        <span class="emoji">⚔️</span>
        <h2>剣戟の森</h2>
        <p>剣で敵を倒しながらゴールを目指す横スクロールアクション。</p>
      </a>
    </div>
    <footer>
      <a href="https://github.com/b-w-hiroki/AI_project002" target="_blank" rel="noreferrer"
        >ソースコード（GitHub）</a
      >
    </footer>
  </body>
</html>
