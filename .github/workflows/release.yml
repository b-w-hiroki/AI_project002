name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (e.g. v1.0.0 or v1.0.0-rc.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean
      target_ref:
        description: "Git ref to release"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            games/potion-workshop/package-lock.json
            games/side-scroller/package-lock.json
            games/color-match/package-lock.json
            games/fist-legend/package-lock.json
            games/karma-quest/package-lock.json
            games/sangoku-tap/package-lock.json

      - name: Build six games
        shell: bash
        run: |
          set -euo pipefail
          for game in potion-workshop side-scroller color-match fist-legend karma-quest sangoku-tap; do
            echo "::group::build $game"
            (
              cd "games/$game"
              npm ci
              npm run build
            )
            echo "::endgroup::"
          done

      - name: Package release ZIPs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-packages
          for game in potion-workshop side-scroller color-match fist-legend karma-quest sangoku-tap; do
            (
              cd "games/$game/dist"
              zip -qr "../../../release-packages/$game.zip" .
            )
          done
          TARGET_SHA="$(git rev-parse HEAD)"
          printf "version=%s\ncommit=%s\ngenerated_utc=%s\n" \
            "$VERSION" "$TARGET_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > release-packages/BUILD-INFO.txt
          (
            cd release-packages
            sha256sum *.zip > SHA256SUMS.txt
          )
          ls -lh release-packages

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: release-packages/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: release-packages/
      - name: Create GitHub Release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          TARGET_SHA: ${{ needs.build.outputs.target_sha }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 1
          fi

          args=(
            release create "$VERSION"
            release-packages/*.zip
            release-packages/BUILD-INFO.txt
            release-packages/SHA256SUMS.txt
            --target "$TARGET_SHA"
            --title "$VERSION"
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --notes-file RELEASE-CANDIDATE.md)
          else
            args+=(--notes-file CHANGELOG.md)
          fi

          gh "${args[@]}"
