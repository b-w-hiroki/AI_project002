name: Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "games/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "games/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game:
          - color-match
          - fist-legend
          - karma-quest
          - potion-workshop
          - sangoku-tap
          - side-scroller
    defaults:
      run:
        working-directory: games/${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/${{ matrix.game }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [potion-workshop, side-scroller]
    defaults:
      run:
        working-directory: games/${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/${{ matrix.game }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload side-scroller visual QA
        if: matrix.game == 'side-scroller' && always()
        uses: actions/upload-artifact@v4
        with:
          name: side-scroller-visual-qa
          path: games/side-scroller/e2e/screenshots/
          if-no-files-found: error
          retention-days: 14
