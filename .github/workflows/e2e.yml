name: Browser E2E
# Temporary baseline capture; restored to read-only after Karma snapshot refresh.

on:
  pull_request:
    branches: [main]
    paths:
      - "games/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "games/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game:
          - color-match
          - fist-legend
          - karma-quest
          - potion-workshop
          - sangoku-tap
          - side-scroller
    defaults:
      run:
        working-directory: games/${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/${{ matrix.game }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [color-match, fist-legend, karma-quest, potion-workshop, sangoku-tap, side-scroller]
    defaults:
      run:
        working-directory: games/${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/${{ matrix.game }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: |
          if [ "${{ matrix.game }}" = "karma-quest" ]; then
            npm run e2e -- --update-snapshots
          else
            npm run e2e
          fi
      - name: Commit refreshed Karma Linux snapshots
        if: always() && matrix.game == 'karma-quest' && github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/karma-linux-snapshots
          cp e2e/game.spec.ts-snapshots/*-linux.png /tmp/karma-linux-snapshots/
          git fetch origin "${{ github.head_ref }}:refs/remotes/origin/${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "refs/remotes/origin/${{ github.head_ref }}"
          cp /tmp/karma-linux-snapshots/* e2e/game.spec.ts-snapshots/
          git add e2e/game.spec.ts-snapshots/*-linux.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: refresh Karma Quest Linux visual baselines"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
      - name: Upload browser visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-visual-qa
          path: |
            games/${{ matrix.game }}/e2e/screenshots/
            games/${{ matrix.game }}/e2e/game.spec.ts-snapshots/
            games/${{ matrix.game }}/test-results/
          if-no-files-found: warn
          retention-days: 14
