name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # リポジトリ直下は静的ハブページのみで package-lock.json が無いため、
          # 各ゲームのロックファイルを明示的に指定する
          cache-dependency-path: |
            games/potion-workshop/package-lock.json
            games/side-scroller/package-lock.json
            games/color-match/package-lock.json
            games/fist-legend/package-lock.json
            games/karma-quest/package-lock.json

      # ポーション工房（/potion-workshop/ サブパスで配信）
      - run: npm ci
        working-directory: games/potion-workshop
      - run: npm run lint
        working-directory: games/potion-workshop
      - run: npm run typecheck
        working-directory: games/potion-workshop
      - run: npm test
        working-directory: games/potion-workshop
      - run: npm run build
        working-directory: games/potion-workshop

      # 剣戟の森（/side-scroller/ サブパスで配信）
      - run: npm ci
        working-directory: games/side-scroller
      - run: npm run lint
        working-directory: games/side-scroller
      - run: npm run typecheck
        working-directory: games/side-scroller
      - run: npm test
        working-directory: games/side-scroller
      - run: npm run build
        working-directory: games/side-scroller

      # カラーマッチ（/color-match/ サブパスで配信）
      - run: npm ci
        working-directory: games/color-match
      - run: npm run lint
        working-directory: games/color-match
      - run: npm run typecheck
        working-directory: games/color-match
      - run: npm test
        working-directory: games/color-match
      - run: npm run build
        working-directory: games/color-match

      # 覇拳伝（/fist-legend/ サブパスで配信）
      - run: npm ci
        working-directory: games/fist-legend
      - run: npm run lint
        working-directory: games/fist-legend
      - run: npm run typecheck
        working-directory: games/fist-legend
      - run: npm test
        working-directory: games/fist-legend
      - run: npm run build
        working-directory: games/fist-legend

      # カルマクエスト（/karma-quest/ サブパスで配信）
      - run: npm ci
        working-directory: games/karma-quest
      - run: npm run lint
        working-directory: games/karma-quest
      - run: npm run typecheck
        working-directory: games/karma-quest
      - run: npm test
        working-directory: games/karma-quest
      - run: npm run build
        working-directory: games/karma-quest

      # ルート（ゲーム一覧のハブページ）+ 各ゲームのビルド成果物を1つの dist/ にまとめる
      - run: |
          mkdir -p dist
          cp index.html dist/index.html
          mkdir -p dist/potion-workshop
          cp -r games/potion-workshop/dist/. dist/potion-workshop/
          mkdir -p dist/side-scroller
          cp -r games/side-scroller/dist/. dist/side-scroller/
          mkdir -p dist/color-match
          cp -r games/color-match/dist/. dist/color-match/
          mkdir -p dist/fist-legend
          cp -r games/fist-legend/dist/. dist/fist-legend/
          mkdir -p dist/karma-quest
          cp -r games/karma-quest/dist/. dist/karma-quest/

      - uses: actions/configure-pages@v5
        with:
          # Pages 未設定のリポジトリでも自動で有効化する
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
