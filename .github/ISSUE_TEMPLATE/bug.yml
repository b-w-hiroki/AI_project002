name: Bug report
description: Report a reproducible gameplay, UI, save, mobile, or platform problem.
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Potion Workshop
        - Sword Forest
        - Color Match
        - Fist Legend
        - Karma Quest
        - Sangoku Tap
        - Hub / release tooling
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Include the shortest reproducible flow.
      placeholder: "1. Open...\n2. Tap...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device / OS / browser
      placeholder: "iPhone 17 / iOS 26 / Safari"
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot / video / console evidence
